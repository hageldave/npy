# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle and Publish

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to use'
        type: environment
        required: true
      commitsha:
        description: Commit SHA to use
        type: string
        required: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions: read-all

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commitsha }}
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - run: pip install numpy

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Check Gradle version
      run: ./gradlew --version
    
    - name: Build with Gradle Wrapper
      env:
        # 1. Map your original un-altered secret to a temporary runner variable
        RAW_SIGNING_KEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
        # 2. Map the password exactly to what Vanniktech expects
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
        # 3. Map your Sonatype Central Token credentials
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_OSSRHUSERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_OSSRHPASSWORD }}
      run: |
        # Use bash to convert literal '\n' sequences into true raw system newlines
        # and export it directly to the environment pool for this execution task
        export ORG_GRADLE_PROJECT_signingInMemoryKey=$(echo "$RAW_SIGNING_KEY" | sed 's/\\n/\n/g')
        ./gradlew assemble --stacktrace
        ./gradlew publishToMavenCentral --stacktrace

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
